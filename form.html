<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>Formulir Permintaan Proyek Web</h1>
    <p>"Silakan isi data di bawah ini untuk berkolaborasi membuat aplikasi web:"</p>
    <form action="#">
        <label for="name">Nama Lengkap</label><br>
        <input type="text" name="name" id="name">
        <br><br>
        <label for="email">Email Anda:</label><br>
        <input type="email" name="email" id="email">
        <br><br>
        <label for="dropdown">Jenis Proyek:</label><br>
        <select name="Dropdown" id="">
            <option value="landing_page">Landing Page</option>
            <option value="sistem_informasi">Sistem Informasi</option>
            <option value="e_commerce">E-Commerce</option>
        </select><br><br>
        <h3>Tingkat Urgensi:</h3>
        <label for="santai">Santai</label>
        <input type="radio" name="Urgensi" id="santai" value="santai">
        <label for="segera">Segera</label>
        <input type="radio" name="Urgensi" id="segera" value="segera"><br>

        <textarea name="kebutuhan_fitur" id="fitur" rows="5"></textarea><br>
        <input type="submit" value="Kirim Permintaan">
    </form>
</body>
</html>
